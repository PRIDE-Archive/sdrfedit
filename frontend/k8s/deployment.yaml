apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdrf-editor
  namespace: sdrf-editor
  labels:
    app: sdrf-editor
spec:
  replicas: 2
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: sdrf-editor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        app: sdrf-editor
    spec:
      # ghcr.io/pride-archive/sdrfedit-frontend is public (public repo), so no
      # imagePullSecrets needed -- add one here if the package is made private.
      imagePullSecrets: []
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: sdrf-editor
          # :pride is built from the pride-deploy branch for hh-11 testing.
          # Once verified, pin to the exact commit-SHA tag instead -- see
          # backend/k8s/README.md for why :latest/:pride are not safe to
          # leave a production deployment tracking long-term.
          image: ghcr.io/pride-archive/sdrfedit-frontend:pride
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /pride/services/sdrf-editor/
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /pride/services/sdrf-editor/
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
