# Serves the Angular SPA under /pride/services/sdrf-editor/, matching the
# --base-href baked into the build (see ../Dockerfile). The build output is
# copied into /usr/share/nginx/html/pride/services/sdrf-editor/, so a plain
# root + try_files maps request paths straight to it -- no rewrite needed,
# and no ingress-side path stripping (Angular's router ties routing to
# <base href>, so it needs to agree with the real browser URL).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /pride/services/sdrf-editor {
        return 301 /pride/services/sdrf-editor/;
    }

    location /pride/services/sdrf-editor/ {
        try_files $uri $uri/ /pride/services/sdrf-editor/index.html;

        # The app shell -- never cache it, so a redeploy is visible on next
        # load instead of stuck behind a shell referencing an old build's
        # asset names.
        location = /pride/services/sdrf-editor/index.html {
            add_header Cache-Control "no-cache";
        }

        # Static assets (outputHashing: none in this build, so this is a
        # conservative short cache rather than "immutable").
        location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            add_header Cache-Control "public, max-age=3600";
        }
    }
}
