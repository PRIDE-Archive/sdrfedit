apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdrf-assistant
  namespace: sdrf-assistant
  labels:
    app: sdrf-assistant
spec:
  replicas: 2
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app: sdrf-assistant
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        app: sdrf-assistant
    spec:
      # ghcr.io/pride-archive/sdrfedit-backend is public (public repo), so no
      # imagePullSecrets needed -- add one here if the package is made private.
      imagePullSecrets: []
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: tmp-volume
          emptyDir: {}
      containers:
        - name: sdrf-assistant
          # :pride is built from the pride-deploy branch for hh-11 testing.
          # Once verified, pin to the exact commit-SHA tag instead -- see
          # backend/k8s/README.md for why :latest/:pride are not safe to
          # leave a production deployment tracking long-term.
          image: ghcr.io/pride-archive/sdrfedit-backend:pride
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sdrf-assistant-config
            - secretRef:
                name: sdrf-assistant-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          # Startup runs docker-entrypoint.sh, which (re)builds the spec + cell-line
          # indexes before uvicorn starts -- give it real time before probes count against it.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
