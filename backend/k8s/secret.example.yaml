# Copy this to secret.yaml, fill in real values, and
# `kubectl -n sdrf-assistant apply -f secret.yaml`.
# secret.yaml is gitignored -- never commit real keys. GitLab CI does not use
# this file -- it creates sdrf-assistant-secrets directly from GitLab CI/CD
# variables (see ../../.gitlab-ci.yml and README.md). This is the manual
# deploy.sh fallback only.
apiVersion: v1
kind: Secret
metadata:
  name: sdrf-assistant-secrets
type: Opaque
stringData:
  # Leave empty if pride-llm-api on hh-44 doesn't require a key (internal-only access).
  LLM_API_KEY: ""
  EMBEDDING_API_KEY: ""
  MINERU_API_KEY: ""
